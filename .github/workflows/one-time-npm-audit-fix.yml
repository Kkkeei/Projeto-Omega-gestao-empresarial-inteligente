name: One-time fix for npm audit advisory

on:
  push:
    branches: ["fix/certidoes-producao-hardening"]

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply compatible npm audit fixes (no force)
        working-directory: frontend
        run: npm audit fix
      - name: Confirm audit and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --json > /tmp/omega-npm-audit.json
          node -e "const r=require('/tmp/omega-npm-audit.json'); console.log(JSON.stringify(r.metadata?.vulnerabilities,null,2)); if ((r.metadata?.vulnerabilities?.high||0)>0 || (r.metadata?.vulnerabilities?.critical||0)>0) process.exit(1)"
          npm run build
      - name: Commit updated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): update vulnerable source-map dependency"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Dependency lockfile already has no applicable changes."
          fi
