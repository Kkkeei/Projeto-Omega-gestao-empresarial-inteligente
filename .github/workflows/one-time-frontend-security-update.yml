name: One-time frontend dependency security update

on:
  push:
    branches: ["fix/certidoes-producao-hardening"]

permissions:
  contents: write

jobs:
  update-vite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update Vite within supported peer range
        working-directory: frontend
        run: npm install --save-dev "vite@^6.4.5"
      - name: Report dependency audit
        working-directory: frontend
        run: |
          npm audit --json > /tmp/omega-npm-audit.json || true
          node -e "const r=require('/tmp/omega-npm-audit.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities, advisories:Object.keys(r.vulnerabilities||{})},null,2))"
      - name: Validate clean installation and production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): upgrade Vite to patched 6.4 line"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Vite manifest and lockfile already match."
          fi
