name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  backend-and-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend bridge
      - name: Backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          OMEGA_ENV: test
          OMEGA_JWT_SECRET: ci-test-secret-not-for-production-0123456789
          OMEGA_CERTIFICADO_MASTER_KEY: ${{ secrets.OMEGA_CERTIFICADO_MASTER_KEY }}
        run: python -m pytest -q backend/tests -ra
      - name: Bridge tests
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge
          OMEGA_ENV: test
        run: python -m pytest -q bridge/test_app.py -ra

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Report frontend dependency advisories
        working-directory: frontend
        run: |
          npm audit --json > /tmp/omega-npm-audit.json || true
          node -e "const r=require('/tmp/omega-npm-audit.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities, vulnerabilities:r.vulnerabilities},null,2))"
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
