name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-and-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend bridge
      - name: Backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          OMEGA_ENV: test
        run: python -m pytest -q backend/tests -ra
      - name: Bridge tests
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge
          OMEGA_ENV: test
        run: python -m pytest -q bridge/test_app.py -ra

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
