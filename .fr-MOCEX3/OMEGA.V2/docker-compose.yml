services:
  backend:
    build: ./backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    environment:
      OMEGA_DB_PATH: /app/omega.db
      OMEGA_STORAGE_PATH: /storage
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
